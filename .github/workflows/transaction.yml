name: Process NeoBank Transaction

on:
  repository_dispatch:
    types: [register_terminal, pay_transaction, create_card, toggle_terminal_block]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Transaction Processor
        run: |
          python process.py "${{ github.event.action }}" '${{ toJson(github.event.client_payload) }}'

      - name: Commit & Push Changes
        run: |
          git config --global user.name "NeoBank Bot"
          git config --global user.email "bot@neobank.local"
          git add db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Transaction: ${{ github.event.action }}" && git push)
