<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPay Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md flex flex-col gap-5">
        
        <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
            <div>
                <h1 class="text-xl font-bold text-blue-400">MPay Wallet</h1>
                <p class="text-xs text-slate-400">Клиентский кошелек</p>
            </div>
            <button onclick="loadCardData()" class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700">🔄</button>
        </div>

        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 flex gap-2">
            <input type="text" id="client-card-num" placeholder="Номер вашей карты" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500">
            <button onclick="loadCardData()" class="bg-blue-600 px-4 font-bold rounded-xl text-sm hover:bg-blue-500">Войти</button>
        </div>

        <div id="card-widget" class="hidden bg-gradient-to-br from-blue-900 via-slate-900 to-indigo-950 p-6 rounded-3xl border border-blue-500/30 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-start">
                <span class="text-xs font-semibold text-blue-300 tracking-widest uppercase">MPay Virtual</span>
                <span id="card-status-badge" class="text-xs px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-bold">Активна</span>
            </div>
            <div class="text-3xl font-extrabold tracking-wider my-2" id="card-display-num">•••• •••• •••• ••••</div>
            <div class="flex justify-between items-end">
                <div>
                    <div class="text-xs text-slate-400">Баланс</div>
                    <div class="text-2xl font-bold text-emerald-400"><span id="card-balance">0</span> EGP</div>
                </div>
                <button id="freeze-btn" onclick="toggleFreeze()" class="py-2 px-4 bg-amber-600 hover:bg-amber-500 text-xs font-bold rounded-xl transition">
                    Заморозить
                </button>
            </div>
        </div>

        <div id="actions-widget" class="hidden flex flex-col gap-3">
            <button onclick="payViaQr()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2">
                📷 Сканировать QR-код
            </button>
        </div>

        <div id="client-status" class="text-center text-xs text-slate-400">Введите номер карты для просмотра</div>
    </div>

    <script>
        // Автоматическое определение имя пользователя и репозитория из URL GitHub Pages
        const pathParts = window.location.hostname.split('.');
        const repoOwner = pathParts[0];
        const repoName = window.location.pathname.split('/')[1] || '';

        let currentCard = null;

        async function loadCardData() {
            const cardNum = document.getElementById('client-card-num').value.trim();
            if (!cardNum) return alert("Введите номер карты!");

            setStatus("Загрузка данных...", "text-blue-400");
            
            // Чтение напрямую из RAW ссылки - ТОКЕН НЕ НУЖЕН!
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/cards/${cardNum}.json?t=${Date.now()}`);
                if (!res.ok) throw new Error("Карта не найдена");
                
                const data = await res.json();
                currentCard = { ...data, number: cardNum };
                renderCard();
            } catch (e) {
                setStatus("Карта не найдена!", "text-rose-400");
            }
        }

        function renderCard() {
            document.getElementById('card-widget').classList.remove('hidden');
            document.getElementById('actions-widget').classList.remove('hidden');
            document.getElementById('card-display-num').innerText = currentCard.number;
            document.getElementById('card-balance').innerText = currentCard.balance;

            const badge = document.getElementById('card-status-badge');
            const freezeBtn = document.getElementById('freeze-btn');

            if (currentCard.isBlocked) {
                badge.innerText = "Заблокирована Админом";
                badge.className = "text-xs px-2 py-1 rounded-full bg-rose-500/20 text-rose-400 font-bold";
                freezeBtn.classList.add('hidden');
            } else if (currentCard.frozenByClient) {
                badge.innerText = "Заморожена вами";
                badge.className = "text-xs px-2 py-1 rounded-full bg-amber-500/20 text-amber-400 font-bold";
                freezeBtn.innerText = "Разморозить";
            } else {
                badge.innerText = "Активна";
                badge.className = "text-xs px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-bold";
                freezeBtn.innerText = "Заморозить";
            }
            setStatus("Данные актуальны", "text-slate-400");
        }

        async function toggleFreeze() {
            let token = localStorage.getItem('mpay_client_token');
            if (!token) {
                token = prompt("Введите доступный GitHub Token для записи изменений:");
                if (!token) return;
                localStorage.setItem('mpay_client_token', token);
            }

            // Получаем SHA для записи
            const apiRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/cards/${currentCard.number}.json`, {
                headers: { "Authorization": `token ${token}` }
            });
            const apiData = await apiRes.json();

            currentCard.frozenByClient = !currentCard.frozenByClient;

            const updateRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/cards/${currentCard.number}.json`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Client freeze update",
                    content: btoa(JSON.stringify({
                        uid: currentCard.uid,
                        balance: currentCard.balance,
                        pinHash: currentCard.pinHash,
                        rawPin: currentCard.rawPin,
                        isBlocked: currentCard.isBlocked,
                        frozenByClient: currentCard.frozenByClient
                    }, null, 2)),
                    sha: apiData.sha
                })
            });

            if (updateRes.ok) {
                loadCardData();
            } else {
                alert("Ошибка доступа! Проверьте токен.");
                localStorage.removeItem('mpay_client_token');
            }
        }

        function payViaQr() {
            const data = prompt("Сканируйте QR код:");
            if(data) alert("Оплачено: " + data);
        }

        function setStatus(msg, color) {
            const el = document.getElementById('client-status');
            el.innerText = msg;
            el.className = `text-center text-xs ${color}`;
        }
    </script>
</body>
</html>
